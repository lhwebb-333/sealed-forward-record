name: verify

# Checks the whole record on every push and every pull request, and once
# a day. It fails, in public, if any row was edited, dropped or inserted,
# if any proof is missing or proves a different hash, if anything other
# than hashes and proofs is in the repository, or if a Bitcoin proof does
# not match its block.

on:
  push:
  pull_request:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the OpenTimestamps library
        run: python -m pip install opentimestamps==0.4.5

      - name: Verify the record
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          BASE=""
          if [ "$EVENT" = "push" ] && [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ]; then
            BASE="$BEFORE"
          elif [ "$EVENT" = "pull_request" ]; then
            BASE="$PR_BASE"
          fi
          if [ -n "$BASE" ]; then
            python tools/record.py verify --bitcoin --base-ref "$BASE"
          else
            python tools/record.py verify --bitcoin
          fi
